<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美股快讯</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--bd:#e5e7eb;--up:#0a8f4d;--dn:#d92d20;--ac:#1f5eff;padding-top:env(safe-area-inset-top,0)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e8eaee;--mut:#8b93a1;--bd:#262c36;--up:#3ddc84;--dn:#ff6b61;--ac:#6b93ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}
h1{font-size:20px;margin:0}
.tag{font-size:11px;color:var(--mut)}
.idx{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}
.i{flex:0 0 auto;min-width:120px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
.i b{display:block;font-size:12px;color:var(--mut);font-weight:500}
.i span{font-size:16px;font-weight:600}.i em{font-style:normal;font-size:12px;margin-left:6px}
.up{color:var(--up)}.dn{color:var(--dn)}
.bar{position:sticky;top:env(safe-area-inset-top,0);background:var(--bg);padding:8px 0;z-index:2}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.q{display:flex;gap:6px;margin-top:8px}
.q input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:14px}
.q button{padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
.n{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0;color:inherit;text-decoration:none}
.n:hover{border-color:var(--ac)}
.n h3{margin:0 0 6px;font-size:16px;line-height:1.45}
.n p{margin:0 0 8px;color:var(--mut);font-size:14px}
.m{font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.s{padding:1px 7px;border-radius:6px;font-weight:600;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.msg{text-align:center;color:var(--mut);padding:30px 0}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>📈 美股快讯</h1><span class="tag" id="upd"></span></header>
<div class="idx" id="idx"></div>
<div class="bar">
 <div class="tabs" id="tabs"></div>
 <div class="q"><input id="sym" placeholder="输入股票代码，如 AAPL" maxlength="10"><button id="go">搜索</button></div>
</div>
<div id="list"></div>
<p class="note">新闻与行情来自 Finnhub，可能有延迟。仅显示标题与摘要，点击跳转原文。不构成投资建议。</p>
</div>
<script>
var CATS=[["general","要闻"],["merger","并购"],["crypto","加密"],["forex","外汇"]];
var cur={category:"general"},$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ago(t){var s=Date.now()/1000-t;if(s<3600)return Math.max(1,Math.floor(s/60))+" 分钟前";if(s<86400)return Math.floor(s/3600)+" 小时前";return Math.floor(s/86400)+" 天前"}
function tabs(){$("tabs").innerHTML=CATS.map(function(c){return '<button data-c="'+c[0]+'" class="'+(!cur.symbol&&cur.category===c[0]?"on":"")+'">'+c[1]+"</button>"}).join("")}
async function getJSON(u){var r=await fetch(u);var d=await r.json();if(!r.ok)throw new Error(d.error||"请求失败");return d}
async function loadNews(){
 tabs();$("list").innerHTML='<div class="msg">加载中…</div>';
 var u="/api/news?"+(cur.symbol?"symbol="+encodeURIComponent(cur.symbol):"category="+cur.category);
 try{
  var a=await getJSON(u);
  $("list").innerHTML=a.length?a.map(function(n){
   var tk=(n.related||"").split(",").filter(Boolean).slice(0,3).map(function(t){return '<span class="s">'+esc(t)+"</span>"}).join("");
   return '<a class="n" target="_blank" rel="noopener noreferrer" href="'+esc(n.url)+'"><h3>'+esc(n.headline)+"</h3>"+(n.summary?"<p>"+esc(n.summary)+"…</p>":"")+'<div class="m"><span>'+esc(n.source)+"</span><span>"+ago(n.time)+"</span>"+tk+"</div></a>"}).join(""):'<div class="msg">暂无相关新闻</div>';
  $("upd").textContent="更新于 "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
 }catch(e){$("list").innerHTML='<div class="msg">加载失败：'+esc(e.message)+"</div>"}
}
async function loadQuotes(){
 try{
  var a=await getJSON("/api/quotes");
  $("idx").innerHTML=a.map(function(q){var up=q.pct>=0;return '<div class="i"><b>'+q.name+" · "+q.symbol+'</b><span>'+(q.price||0).toFixed(2)+'</span><em class="'+(up?"up":"dn")+'">'+(up?"+":"")+(q.pct||0).toFixed(2)+"%</em></div>"}).join("");
 }catch(e){$("idx").innerHTML=""}
}
$("tabs").addEventListener("click",function(e){var c=e.target.dataset.c;if(c){cur={category:c};$("sym").value="";loadNews()}});
function search(){var s=$("sym").value.trim().toUpperCase();if(s){cur={symbol:s};loadNews()}}
$("go").onclick=search;$("sym").addEventListener("keydown",function(e){if(e.key==="Enter")search()});
loadNews();loadQuotes();
setInterval(function(){loadNews();loadQuotes()},60000);
</script>
</body>
</html>
